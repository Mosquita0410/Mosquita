<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorpresa! - oaoa_mosquita</title>
  
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Bubblegum+Sans" />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <main class="secret-container">
    <h1 class="secret-title">sapeca</h1>
    
    <div class="video-wrapper">
      <video controls autoplay loop class="secret-video">
        <source src="../IMG/meu-video.mp4" type="video/mp4">
    
      </video>
    </div>

  </main>

  <script>
    window.addEventListener('pageshow', function(event) {
      const container = document.querySelector('.container');
      if (container) {
        container.classList.remove('page-exit');
      }
    });

    document.querySelectorAll('a').forEach(link => {
      if (link.target !== '_blank' && link.getAttribute('href') && !link.getAttribute('href').startsWith('#')) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const destination = this.href;
          
          const container = document.querySelector('.container');
          if (container) {
            container.classList.add('page-exit');
          }

          setTimeout(() => {
            window.location.href = destination;
          }, 300);
        });
      }
    });
  </script>

</body>
</html>
