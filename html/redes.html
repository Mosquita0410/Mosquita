<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociais - papa_mosquita</title>

  <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>

  <main class="container">
  
    <a href="secret.html" class="avatar-link" title="Clique em mim!">
      <div class="avatar-container">
        <img src="../IMG/avatar.jpg" alt="PAPA_MOSQUITA Avatar" class="avatar">
      </div>
    </a>

    <h1 class="username">papa_mosquita</h1>

    <div class="links-container">
      <a href="https://www.instagram.com/papa_mosquita/" target="_blank" rel="noopener noreferrer" class="link-btn">INSTAGRAM</a>
      <a href="https://x.com/papa_mosquita" target="_blank" rel="noopener noreferrer" class="link-btn">TWITTER</a>
      <a href="https://www.tiktok.com/@papa_mosquita" target="_blank" rel="noopener noreferrer" class="link-btn">TIKTOK</a>
      <a href="https://bsky.app/profile/papamosca.bsky.social" target="_blank" rel="noopener noreferrer" class="link-btn">BLUESKY</a>
      <a href="https://cara.app/papamosquita" target="_blank" rel="noopener noreferrer" class="link-btn">CARA APP</a>
      
    </div>
  </main>

  <script>
    window.addEventListener('pageshow', function(event) {
      const container = document.querySelector('.container');
      if (container) {
        container.classList.remove('page-exit');
      }
    });

    document.querySelectorAll('a').forEach(link => {
      if (link.target !== '_blank' && link.getAttribute('href') && !link.getAttribute('href').startsWith('#')) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const destination = this.href;
          
          const container = document.querySelector('.container');
          if (container) {
            container.classList.add('page-exit');
          }

          setTimeout(() => {
            window.location.href = destination;
          }, 300);
        });
      }
    });
  </script>

</body>
</html>
